spring:
  datasource:
    url: jdbc:h2:mem:shortener-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=10000
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 20
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: false

app:
  base-url: http://localhost:8080
  stats-zone: UTC
  code-length: 7
  code-max-attempts: 5

logging:
  level:
    com.example.shortener: INFO
    org.hibernate.SQL: WARN
