<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mini URL Shortener</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --line: #334155;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --accent: #38bdf8;
            --danger: #f87171;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 2.5rem 1rem;
            background: var(--bg);
            color: var(--text);
            font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        main { max-width: 880px; margin: 0 auto; }
        h1 { font-size: 1.35rem; margin: 0 0 .25rem; }
        .sub { color: var(--muted); margin: 0 0 2rem; font-size: .875rem; }
        form { display: flex; gap: .5rem; margin-bottom: .75rem; }
        input[type=url] {
            flex: 1;
            padding: .7rem .85rem;
            border-radius: .5rem;
            border: 1px solid var(--line);
            background: var(--card);
            color: var(--text);
            font: inherit;
        }
        input[type=url]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
        button {
            padding: .7rem 1.1rem;
            border: 0;
            border-radius: .5rem;
            background: var(--accent);
            color: #04212f;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }
        button:disabled { opacity: .6; cursor: progress; }
        .error { color: var(--danger); min-height: 1.4rem; font-size: .875rem; margin: 0 0 1.25rem; }
        table { width: 100%; border-collapse: collapse; font-size: .875rem; }
        th, td { text-align: left; padding: .55rem .5rem; border-bottom: 1px solid var(--line); }
        th { color: var(--muted); font-weight: 500; }
        td.url { max-width: 380px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }
        .empty { color: var(--muted); padding: 1rem 0; font-size: .875rem; }
        code { background: var(--card); padding: .1rem .35rem; border-radius: .25rem; }
    </style>
</head>
<body>
<main>
    <h1>Mini URL Shortener</h1>
    <p class="sub">Submit a long URL, get a short code. Every visit is counted.</p>

    <form id="create-form">
        <input id="url-input" type="url" required placeholder="https://example.com/some/very/long/path?query=1"
               autocomplete="off" spellcheck="false">
        <button id="submit" type="submit">Shorten</button>
    </form>
    <p class="error" id="error" role="alert"></p>

    <table>
        <thead>
        <tr>
            <th>Code</th>
            <th>URL</th>
            <th>Visits</th>
            <th>Created</th>
        </tr>
        </thead>
        <tbody id="rows"></tbody>
    </table>
    <p class="empty" id="empty" hidden>No links yet.</p>
</main>

<script>
    const form = document.getElementById('create-form');
    const input = document.getElementById('url-input');
    const submit = document.getElementById('submit');
    const errorBox = document.getElementById('error');
    const rows = document.getElementById('rows');
    const empty = document.getElementById('empty');

    async function load() {
        const response = await fetch('/api/links');
        if (!response.ok) {
            errorBox.textContent = 'Could not load links.';
            return;
        }
        const links = await response.json();
        rows.replaceChildren(...links.map(renderRow));
        empty.hidden = links.length > 0;
    }

    function renderRow(link) {
        const tr = document.createElement('tr');

        const codeTd = document.createElement('td');
        const codeLink = document.createElement('a');
        codeLink.href = link.short_url;
        codeLink.textContent = link.code;
        codeTd.append(codeLink);

        const urlTd = document.createElement('td');
        urlTd.className = 'url';
        urlTd.textContent = link.url;
        urlTd.title = link.url;

        const visitsTd = document.createElement('td');
        visitsTd.textContent = link.visit_count;

        const createdTd = document.createElement('td');
        createdTd.textContent = new Date(link.created_at).toLocaleString();

        tr.append(codeTd, urlTd, visitsTd, createdTd);
        return tr;
    }

    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        errorBox.textContent = '';
        submit.disabled = true;
        try {
            const response = await fetch('/api/links', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: input.value })
            });
            if (!response.ok) {
                const problem = await response.json().catch(() => ({}));
                errorBox.textContent = problem.message || ('Request failed with status ' + response.status);
                return;
            }
            input.value = '';
            await load();
        } catch (e) {
            errorBox.textContent = 'Network error: ' + e.message;
        } finally {
            submit.disabled = false;
        }
    });

    load();
</script>
</body>
</html>
