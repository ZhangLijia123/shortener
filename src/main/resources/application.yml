server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: url-shortener

  datasource:
    # H2 in file mode: the data lives in ./data/shortener.mv.db and survives restarts.
    # LOCK_TIMEOUT is raised so that concurrent redirects wait instead of failing.
    url: jdbc:h2:file:./data/shortener;AUTO_SERVER=FALSE;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=10000
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 20
      pool-name: shortener-pool

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  h2:
    # Demo convenience only; remove or secure before running this anywhere public.
    # Kept under two path segments so it is not shadowed by the /{code} redirect route.
    console:
      enabled: true
      path: /db/console

  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  # Used to build the "short_url" field in responses.
  base-url: ${BASE_URL:http://localhost:8080}
  # Time zone that defines a "day" for the daily statistics endpoint.
  stats-zone: ${STATS_ZONE:UTC}
  # 6..8 characters from [a-zA-Z0-9]
  code-length: 7
  code-max-attempts: 5

logging:
  level:
    com.example.shortener: INFO
